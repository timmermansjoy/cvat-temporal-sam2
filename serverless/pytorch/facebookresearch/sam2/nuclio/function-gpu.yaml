metadata:
  name: pth-facebookresearch-sam2
  namespace: cvat
  annotations:
    name: 'Segment Anything 2: Tracker'
    type: tracker
    supported_shape_types: mask, polygon

spec:
  description: Video object tracking with Segment Anything 2.1
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 5m
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam2
    - name: HF_HOME
      value: /opt/nuclio/sam2/.cache/huggingface

  build:
    image: cvat.pth.facebookresearch.sam2:latest-gpu
    baseImage: ubuntu:22.04
    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: RUN
          value: |-
            apt-get update \
              && apt-get install -y --no-install-recommends \
               git \
               ca-certificates \
               python-is-python3 \
                python3 \
                python3-pip \
              && rm -rf /var/lib/apt/lists/*
        - kind: WORKDIR
          value: /opt/nuclio/sam2
        - kind: RUN
          value: |-
            SAM2_BUILD_CUDA=0 pip install \
              torch==2.5.1+cu124 torchvision==0.20.1+cu124 \
              numpy==1.26.4 Pillow==10.4.0 \
              opencv-python-headless==4.10.0.84 redis==5.2.0 \
              huggingface-hub==0.27.1 tqdm==4.67.1 hydra-core==1.3.2 iopath==0.1.10 \
              git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4 \
              --extra-index-url https://download.pytorch.org/whl/cu124 \
              --no-cache-dir
        - kind: RUN
          value: |-
            HF_HOME=/opt/nuclio/sam2/.cache/huggingface python -c \
               "from huggingface_hub import snapshot_download; snapshot_download('facebook/sam2.1-hiera-tiny')"

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 268435456 # 256MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
